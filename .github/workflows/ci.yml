name: CI - Build e Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # permite que o pipeline de CD reutilize o CI antes de publicar

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências (build)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes automatizados com cobertura
        run: |
          python -m pytest --cov=app --cov-report=term-missing tests/

      - name: Validar docker-compose.yml
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: senha-apenas-para-validacao-no-ci

      - name: Build da imagem Docker
        run: docker build --build-arg APP_VERSION=ci -t todo-api:ci .

      - name: Subir o container e validar /health (smoke test da imagem)
        run: |
          docker run -d --name todo-api-ci -p 5000:5000 todo-api:ci
          trap 'docker logs todo-api-ci; docker rm -f todo-api-ci' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
               http://localhost:5000/health
