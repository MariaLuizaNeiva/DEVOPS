name: Rollback manual

# Volta o ambiente de homologação para uma versão estável já publicada.
# Actions > "Rollback manual" > Run workflow > informar a versão (ex.: 1.0.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão estável para restaurar (ex.: 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Rollback para a versão informada
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERSION: ${{ inputs.version }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar entradas
        run: |
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: use o formato 1.0.0"
            exit 1
          fi
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Secret POSTGRES_PASSWORD não configurado"
            exit 1
          fi
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy da versão informada
        run: bash scripts/deploy.sh "$VERSION"

      - name: Smoke test
        run: bash scripts/smoke_test.sh "$VERSION"

      - name: Resumo
        run: |
          {
            echo "### ↩️ Rollback manual concluído"
            echo "- Versão restaurada: \`${VERSION#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar ambiente
        if: always()
        run: docker compose down -v || true
